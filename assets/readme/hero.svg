<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" role="img" aria-label="tidy-data-folders: map-first reorg with approved-only execute">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#334155" stroke-width="0.6" opacity="0.45"/>
    </pattern>
  </defs>
  <rect width="1200" height="420" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="20" fill="url(#grid)"/>
  <!-- left title -->
  <text x="56" y="92" fill="#f8fafc" font-family="ui-sans-serif,system-ui,Segoe UI,sans-serif" font-size="42" font-weight="700">tidy-data-folders</text>
  <text x="56" y="138" fill="#94a3b8" font-family="ui-sans-serif,system-ui,Segoe UI,sans-serif" font-size="22">Map-first reorg for AI agents — plan first, then move</text>
  <rect x="56" y="168" width="220" height="36" rx="18" fill="#064e3b"/>
  <text x="76" y="192" fill="#6ee7b7" font-family="ui-monospace,Consolas,monospace" font-size="16">approved=true only</text>
  <rect x="290" y="168" width="200" height="36" rx="18" fill="#422006"/>
  <text x="310" y="192" fill="#fcd34d" font-family="ui-monospace,Consolas,monospace" font-size="16">root-relative paths</text>
  <rect x="508" y="168" width="170" height="36" rx="18" fill="#1e3a5f"/>
  <text x="528" y="192" fill="#93c5fd" font-family="ui-monospace,Consolas,monospace" font-size="16">never delete data</text>
  <text x="56" y="250" fill="#cbd5e1" font-family="ui-sans-serif,system-ui,Segoe UI,sans-serif" font-size="18">Survey → Plan → Approve → Execute → Audit</text>
  <text x="56" y="290" fill="#64748b" font-family="ui-sans-serif,system-ui,Segoe UI,sans-serif" font-size="16">Unit moves · document renames · path seal · MOVE_LOG</text>
  <text x="56" y="360" fill="#475569" font-family="ui-sans-serif,system-ui,Segoe UI,sans-serif" font-size="15">MIT · Python 3.10+ · PowerShell 7 · Agent skill (SKILL.md)</text>
  <!-- right: folder map card -->
  <rect x="760" y="56" width="380" height="308" rx="16" fill="url(#card)" stroke="#475569" stroke-width="1.5"/>
  <text x="784" y="92" fill="#e2e8f0" font-family="ui-monospace,Consolas,monospace" font-size="15" font-weight="600">ROOT (after)</text>
  <rect x="784" y="112" width="140" height="28" rx="6" fill="#065f46"/>
  <text x="796" y="131" fill="#a7f3d0" font-family="ui-monospace,Consolas,monospace" font-size="13">_projects/</text>
  <rect x="940" y="112" width="120" height="28" rx="6" fill="#1e3a5f"/>
  <text x="952" y="131" fill="#bfdbfe" font-family="ui-monospace,Consolas,monospace" font-size="13">README.md</text>
  <rect x="784" y="156" width="160" height="28" rx="6" fill="#334155"/>
  <text x="796" y="175" fill="#cbd5e1" font-family="ui-monospace,Consolas,monospace" font-size="13">_inbox/2026…</text>
  <rect x="960" y="156" width="140" height="28" rx="6" fill="#334155"/>
  <text x="972" y="175" fill="#cbd5e1" font-family="ui-monospace,Consolas,monospace" font-size="13">docs/ · 99_</text>
  <text x="784" y="220" fill="#94a3b8" font-family="ui-sans-serif,system-ui,Segoe UI,sans-serif" font-size="14">★ open-first CURRENT</text>
  <rect x="784" y="236" width="332" height="40" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="800" y="262" fill="#6ee7b7" font-family="ui-monospace,Consolas,monospace" font-size="13">01_OPEN_FIRST/…/montage.png</text>
  <text x="784" y="310" fill="#64748b" font-family="ui-monospace,Consolas,monospace" font-size="12">MOVE_LOG · status=applied · sha256</text>
  <text x="784" y="336" fill="#475569" font-family="ui-sans-serif,system-ui,Segoe UI,sans-serif" font-size="12">Gate keeps unapproved rows untouched</text>
</svg>
