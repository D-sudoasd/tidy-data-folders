name: Feature request
description: New capability or profile idea
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is painful today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Safety / preflight
        - Unit moves
        - Document rename
        - Profiles / layout
        - Docs / examples
        - Other
    validations:
      required: true
