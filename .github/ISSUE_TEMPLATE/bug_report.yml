name: Bug report
description: Something moved wrong, preflight failed incorrectly, or audit lied
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Prefer a **synthetic** folder repro. Do not upload private data.
  - type: input
    id: version
    attributes:
      label: Version / tag
      placeholder: "v0.2.0 or commit SHA"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS + pwsh + Python
      placeholder: "Windows 11, pwsh 7.4, Python 3.12"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Command line + redacted MOVE_LOG / preflight output
